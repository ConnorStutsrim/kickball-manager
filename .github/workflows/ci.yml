name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
        env:
          # Build-time only: satisfies the DATABASE_URL presence check in
          # src/db/index.ts. Authenticated pages are force-dynamic, so no
          # real query runs at build time — this never needs to connect.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/postgres"
